<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance - MediCare Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>🏥 MediCare Hospital</h2>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="attendance_history.html">History</a></li>
        <li><a href="#" onclick="logout()">Logout</a></li>
    </ul>
</nav>

<div style="max-width:600px; margin:60px auto; padding:30px;
            background:#f5f0e6; border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.15);">

    <h1 style="color:#800000; text-align:center;">
        Mark Attendance
    </h1>

    <p style="text-align:center;">
        Employee ID:
        <strong id="employeeDisplay"></strong>
    </p>

    <form onsubmit="markAttendance(); return false;">

        <label><strong>Select Shift</strong></label>

        <select id="shift"
                style="width:100%; padding:12px; margin:10px 0 25px;
                       border-radius:8px; border:1px solid #aaa;"
                required>

            <option value="">Select Shift</option>
            <option value="Morning">Morning Shift</option>
            <option value="Evening">Evening Shift</option>
            <option value="Night">Night Shift</option>

        </select>

        <button type="submit"
                style="width:100%; padding:14px;
                       background:#800000; color:white;
                       border:none; border-radius:8px;
                       font-size:16px; cursor:pointer;">

            Mark Attendance

        </button>

    </form>

</div>

<script src="script.js"></script>

<script>
    document.getElementById("employeeDisplay").textContent =
        localStorage.getItem("employeeId") || "Not logged in";
</script>

</body>
</html>
